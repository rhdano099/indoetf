name: Update ETF data

on:
  schedule:
    # 11:35 UTC = 5:05pm IST, shortly after NSE close (3:30pm IST). Adjust as you like.
    - cron: "35 11 * * 1-5"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Fetch ETF price history
        run: python3 scripts/fetch_etf_data.py

      - name: Fetch sectors, macro, flows, Nifty 500 index, breadth
        run: python3 scripts/fetch_live_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/etf-history.json data/live.json data/nifty500-price.json data/breadth-history.json
          git diff --quiet --cached || git commit -m "Update live data ($(date -u +%Y-%m-%d))"
          git push
